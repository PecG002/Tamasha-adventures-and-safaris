<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Tamasha</title><link rel="stylesheet" href="style.css"></head><body data-page="edit"><header class="header" id="header"><div class="container nav"><a href="index.html"><img class="logo" src="assets/logo.jpg" alt="Tamasha Adventure & Safaris"></a><button class="menu" id="menu">☰</button><nav class="navlinks" id="navlinks"><a href="index.html" data-page="home">Home</a><a href="about.html" data-page="about">About Us</a><a href="events.html" data-page="events">Events</a><a href="private.html" data-page="private">Private Guide</a><a href="contact.html" data-page="contact">Contact</a><a class="pill" href="contact.html">Book a Trip</a></nav></div></header><main class="container editor"><p class="kicker">SITE EDITOR</p><h1>Update Tamasha</h1><div class="editorcard"><p>Edit your business and event information here. Changes saved in this browser are for preview. For everyone online to see them, export <b>content.js</b> and replace the repository copy.</p></div><div class="editorcard"><h2>Business details</h2><div class="row"><div><label>Name</label><input id="name"></div><div><label>Phone</label><input id="phone"></div></div><div class="row"><div><label>TikTok</label><input id="tiktok"></div><div><label>Till</label><input id="till"></div></div></div><div id="trips"></div><div class="editorcard"><button class="btn primary" id="save">Save on this device</button> <button class="btn" id="export">Export content.js</button> <a class="btn" href="index.html">View website</a><p id="status"></p></div></main><script src="content.js"></script><script>(function(){let d=JSON.parse(localStorage.getItem("tamashaContent")||JSON.stringify(window.TAMASHA_CONTENT));["name","phone","tiktok","till"].forEach(k=>document.getElementById(k).value=d.business[k]||"");let w=document.getElementById("trips");w.innerHTML=d.trips.map((t,i)=>`<div class="editorcard"><h2>Event ${i+1}</h2><label>Title</label><input data-i="${i}" data-k="title" value="${t.title}"><label>Date</label><input data-i="${i}" data-k="date" value="${t.date}"><label>Price</label><input data-i="${i}" data-k="price" value="${t.price}"><label>Image path</label><input data-i="${i}" data-k="image" value="${t.image}"><label>Description</label><textarea data-i="${i}" data-k="intro">${t.intro}</textarea><label>Inclusive, one per line</label><textarea data-i="${i}" data-k="included">${t.included.join("\n")}</textarea></div>`).join("");function collect(){["name","phone","tiktok","till"].forEach(k=>d.business[k]=document.getElementById(k).value);document.querySelectorAll("[data-k]").forEach(e=>{let i=+e.dataset.i,k=e.dataset.k;d.trips[i][k]=k==="included"?e.value.split("\n").filter(Boolean):e.value});return d}document.getElementById("save").onclick=()=>{collect();localStorage.setItem("tamashaContent",JSON.stringify(d));document.getElementById("status").textContent="Saved."};document.getElementById("export").onclick=()=>{collect();let a=document.createElement("a"),b=new Blob(["window.TAMASHA_CONTENT = "+JSON.stringify(d,null,2)+";"],{type:"text/javascript"});a.href=URL.createObjectURL(b);a.download="content.js";a.click()}})();</script></body></html>
